<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri Kỷ Tương Phùng - Ti & Vei</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ec4899;
            --pink-light: #fbcfe8;
            --pink-dark: #be185d;
            --card-bg: rgba(15, 23, 42, 0.7);
            --accent-gold: #fef08a;
            --text-light: #ffffff;
            --beer-color: #f59e0b;
            --foam-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            
            /* Hình nền Nha Trang tải lên GitHub */
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.25), rgba(15, 23, 42, 0.75)), 
                        url('nhatrang.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 2px solid rgba(247, 114, 182, 0.4);
            border-radius: 28px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(236, 72, 153, 0.3);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            color: var(--pink-light);
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #f472b6;
            margin-bottom: 30px;
            font-style: italic;
            font-weight: 700;
        }

        /* Avatar Section */
        .avatar-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .avatar-box {
            text-align: center;
        }

        .avatar {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-pink);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.08);
        }

        .avatar-name {
            margin-top: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--pink-light);
            letter-spacing: 1px;
        }

        /* ----- HIỆU ỨNG RÓT BIA (BEER ANIMATION) ----- */
        .beer-container {
            position: relative;
            width: 60px;
            height: 80px;
            margin: 0 10px;
        }

        .glass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            border: 4px solid #ffffff;
            border-top: none;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Tay cầm ly bia */
        .glass::after {
            content: '';
            position: absolute;
            right: -16px;
            top: 15px;
            width: 12px;
            height: 40px;
            border: 4px solid #ffffff;
            border-left: none;
            border-radius: 0 8px 8px 0;
        }

        /* Dòng nước bia chảy xuống */
        .pour-stream {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 60px;
            background: var(--beer-color);
            opacity: 0;
            animation: pour 4s infinite ease-in-out;
        }

        /* Nước bia đầy lên */
        .beer-liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--beer-color);
            height: 0%;
            animation: fillBeer 4s infinite ease-in-out;
        }

        /* Lớp bọt bia */
        .foam {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 12px;
            background: var(--foam-color);
            border-radius: 10px 10px 0 0;
            opacity: 0;
            animation: foamRise 4s infinite ease-in-out;
        }

        /* Keyframes */
        @keyframes pour {
            0% { height: 0; opacity: 0; }
            15% { height: 60px; opacity: 1; }
            75% { height: 60px; opacity: 1; }
            85% { height: 0; opacity: 0; }
            100% { height: 0; opacity: 0; }
        }

        @keyframes fillBeer {
            0% { height: 0%; }
            20% { height: 0%; }
            75% { height: 80%; }
            90% { height: 80%; }
            100% { height: 0%; }
        }

        @keyframes foamRise {
            0% { bottom: 0; opacity: 0; }
            20% { bottom: 0; opacity: 0; }
            75% { bottom: 80%; opacity: 1; }
            90% { bottom: 80%; opacity: 1; }
            100% { bottom: 0; opacity: 0; }
        }

        /* ----- END BEER ANIMATION ----- */

        /* Countdown Timer */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(190, 24, 93, 0.3);
            border: 1px solid rgba(247, 114, 182, 0.5);
            border-radius: 18px;
            padding: 15px;
            min-width: 90px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .time-number {
            font-size: 2.3rem;
            font-weight: 800;
            color: var(--pink-light);
            display: block;
            text-shadow: 0 2px 10px rgba(236, 72, 153, 0.5);
        }

        .time-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fbcfe8;
            margin-top: 5px;
        }

        /* Footer Quote */
        .quote {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #f8fafc;
            border-top: 1px dashed rgba(247, 114, 182, 0.3);
            padding-top: 20px;
        }

        .highlight {
            color: var(--accent-gold);
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 1.9rem; }
            .avatar { width: 95px; height: 95px; }
            .time-box { min-width: 70px; padding: 10px; }
            .time-number { font-size: 1.7rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tri Kỷ Tương Phùng</h1>
        <p class="subtitle">🌴 Hẹn gặp tại biển Nha Trang 🍻</p>

        <!-- Khung ảnh 2 người & Ly bia rót động -->
        <div class="avatar-group">
            <div class="avatar-box">
                <img src="ti.jpg" alt="Ti" class="avatar">
                <div class="avatar-name">TI</div>
            </div>

            <!-- Animation Rót Bia -->
            <div class="beer-container">
                <div class="pour-stream"></div>
                <div class="glass">
                    <div class="beer-liquid"></div>
                    <div class="foam"></div>
                </div>
            </div>

            <div class="avatar-box">
                <img src="vei.jpg" alt="Vei" class="avatar">
                <div class="avatar-name">VEI</div>
            </div>
        </div>

        <!-- Bộ đếm thời gian -->
        <div class="countdown" id="countdown">
            <div class="time-box">
                <span class="time-number" id="days">00</span>
                <span class="time-label">Ngày</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="hours">00</span>
                <span class="time-label">Giờ</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="minutes">00</span>
                <span class="time-label">Phút</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="seconds">00</span>
                <span class="time-label">Giây</span>
            </div>
        </div>

        <!-- Lời nhắn -->
        <div class="quote">
            "Chén rượu tri kỷ bên bờ biển Nha Trang...<br>
            Hẹn ngày tái ngộ, <span class="highlight">không say không về!</span>"
        </div>
    </div>

    <script>
        // CẤU HÌNH NGÀY HẸN (Năm, Tháng - 1, Ngày, Giờ, Phút)
        // Ví dụ: Ngày 20 Tháng 10 Năm 2026 (Tháng 10 nhập là 9)
        const targetDate = new Date(2026, 9, 20, 18, 0, 0).getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            } else {
                document.getElementById('countdown').innerHTML = 
                    "<h2 style='color: #fbcfe8; font-size: 2rem;'>🍻 ĐÃ ĐẾN GIỜ NHẬU TẠI NHA TRANG RỒI! 🍻</h2>";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
